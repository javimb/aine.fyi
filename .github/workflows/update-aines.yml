name: Update AINE Classification

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  update-aines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate AINE classification
        run: npm run generate-aines

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet data/aine-classification.ts; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: update-aine-classification
          title: "Update AINE classification data"
          body: |
            Automated update of AINE classification data from AEMPS prescripcion.zip.

            This PR was generated by the monthly `update-aines` workflow.
          commit-message: "chore: update AINE classification data from AEMPS"
          labels: automated
